# The image this part builds, from spec's first-party-image workflow: built and run
# under the posture its manifest declares on a pull request, and published, run
# again and pinned from main and a train tag (OPS-R90, OPS-R91, ARCH-R250).
name: image
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lemonfiber/spec/.github/workflows/first-party-image.yml@e745e0f7f79f5f2e76b68e560b1c28e1df956493 # v1.0.103
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
