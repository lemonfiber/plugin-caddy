[package]
name = "caddy-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-caddy"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's proxy.front contract in front of Caddy, through its admin API"
publish = false

[[bin]]
name = "caddy-adapter"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "fdc71e22778e452a697b4a1026e33c9b779066e1" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "fdc71e22778e452a697b4a1026e33c9b779066e1" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "fdc71e22778e452a697b4a1026e33c9b779066e1" }
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "fdc71e22778e452a697b4a1026e33c9b779066e1" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
